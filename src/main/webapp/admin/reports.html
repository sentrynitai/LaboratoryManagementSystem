<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Reports | LMS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        @media print {
            .sidebar, .topbar, .no-print {
                display: none !important;
            }
            .content-body {
                padding: 0 !important;
            }
            body {
                background: #ffffff !important;
            }
            .card {
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">A</div>
                <div>
                    <h2 class="text-white font-bold text-base leading-tight">Admin Portal</h2>
                    <p class="text-xs text-slate-400">LMS Control Center</p>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Dashboard
                </a>
                <a href="laboratories.html" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                    Laboratories
                </a>
                <a href="users.html" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    Users
                </a>
                <a href="lab-details.html" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                    Laboratory Details
                </a>
                <a href="reports.html" class="nav-item active">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    Reports
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="../logout" class="nav-item text-red-400 hover:text-red-300 hover:bg-red-500/10">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Sign Out
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar no-print">
                <h1 class="text-xl font-bold text-slate-800">System Reports Generator</h1>
                <div class="flex items-center gap-3">
                    <button onclick="window.print()" class="btn btn-primary text-xs">
                        🖨️ Print / Export PDF
                    </button>
                </div>
            </header>

            <div class="content-body">
                <!-- Filter Card (Hidden in Print) -->
                <div class="card mb-6 no-print">
                    <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="flex items-center gap-3 w-full sm:w-auto">
                            <label class="text-sm font-semibold text-slate-700 whitespace-nowrap">Report Type:</label>
                            <select id="reportType" onchange="generateReport()" class="px-4 py-2 text-sm border border-slate-300 rounded-lg outline-none focus:border-blue-500 bg-white w-full sm:w-64">
                                <option value="students">Registered Students Report</option>
                                <option value="faculty">Faculty Directory Report</option>
                                <option value="laboratories">Laboratories & Facilities Report</option>
                                <option value="users">All System Users Report</option>
                            </select>
                        </div>
                        <button onclick="generateReport()" class="btn btn-secondary text-xs">
                            🔄 Refresh Data
                        </button>
                    </div>
                </div>

                <!-- Printable Report Sheet -->
                <div class="card">
                    <!-- Report Header -->
                    <div class="border-b border-slate-200 pb-4 mb-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <h2 class="text-xs uppercase font-bold tracking-wider text-blue-700">Laboratory Management System</h2>
                                <h3 id="reportTitle" class="text-2xl font-bold text-slate-900 mt-1">Students Directory Report</h3>
                            </div>
                            <div class="text-right">
                                <p class="text-xs text-slate-400">Generated On</p>
                                <p id="reportDate" class="text-sm font-semibold text-slate-700">-</p>
                            </div>
                        </div>
                    </div>

                    <!-- Dynamic Table -->
                    <div class="data-table-container">
                        <table class="data-table">
                            <thead id="reportHead"></thead>
                            <tbody id="reportData">
                                <tr>
                                    <td class="text-center py-6 text-slate-400">Generating report...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Report Footer -->
                    <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                        <span>Official LMS Institutional Academic Audit</span>
                        <span id="reportCount">Total Records: 0</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript interacting with ReportServlet -->
    <script>
        async function generateReport() {
            const type = document.getElementById('reportType').value;
            try {
                const res = await fetch(`../reports-data?type=${type}`);
                const data = await res.json();

                document.getElementById('reportTitle').textContent = data.title;
                document.getElementById('reportDate').textContent = data.generatedAt;
                document.getElementById('reportCount').textContent = `Total Records: ${data.data ? data.data.length : 0}`;

                renderReportTable(type, data.data || []);
            } catch (err) {
                console.error(err);
            }
        }

        function renderReportTable(type, rows) {
            const thead = document.getElementById('reportHead');
            const tbody = document.getElementById('reportData');

            if (type === 'students') {
                thead.innerHTML = `
                    <tr>
                        <th>#</th>
                        <th>Roll Number</th>
                        <th>Student Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Semester & Section</th>
                        <th>Phone</th>
                    </tr>
                `;
                tbody.innerHTML = rows.map((r, i) => `
                    <tr>
                        <td>${i + 1}</td>
                        <td class="font-semibold">${r.rollNumber}</td>
                        <td>${r.name}</td>
                        <td>${r.email}</td>
                        <td>${r.department}</td>
                        <td>${r.semester} (${r.section || 'A'})</td>
                        <td>${r.phone || '-'}</td>
                    </tr>
                `).join('');

            } else if (type === 'faculty') {
                thead.innerHTML = `
                    <tr>
                        <th>#</th>
                        <th>Employee ID</th>
                        <th>Faculty Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Designation</th>
                        <th>Phone</th>
                    </tr>
                `;
                tbody.innerHTML = rows.map((r, i) => `
                    <tr>
                        <td>${i + 1}</td>
                        <td class="font-semibold">${r.employeeId}</td>
                        <td>${r.name}</td>
                        <td>${r.email}</td>
                        <td>${r.department}</td>
                        <td>${r.designation}</td>
                        <td>${r.phone || '-'}</td>
                    </tr>
                `).join('');

            } else if (type === 'laboratories') {
                thead.innerHTML = `
                    <tr>
                        <th>#</th>
                        <th>Lab Code</th>
                        <th>Lab Name</th>
                        <th>Room Number</th>
                        <th>Department</th>
                        <th>Capacity</th>
                        <th>Equipment Specification</th>
                    </tr>
                `;
                tbody.innerHTML = rows.map((r, i) => `
                    <tr>
                        <td>${i + 1}</td>
                        <td class="font-semibold">${r.labCode}</td>
                        <td>${r.labName}</td>
                        <td>${r.roomNumber}</td>
                        <td>${r.department}</td>
                        <td>${r.capacity} Seats</td>
                        <td class="text-xs">${r.equipmentDetails || '-'}</td>
                    </tr>
                `).join('');

            } else {
                thead.innerHTML = `
                    <tr>
                        <th>User ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Username</th>
                        <th>System Role</th>
                        <th>Department</th>
                        <th>Contact Phone</th>
                    </tr>
                `;
                tbody.innerHTML = rows.map(r => `
                    <tr>
                        <td>#${r.id}</td>
                        <td class="font-semibold">${r.name}</td>
                        <td>${r.email}</td>
                        <td>${r.username}</td>
                        <td><span class="badge ${r.role === 'ADMIN' ? 'badge-danger' : r.role === 'FACULTY' ? 'badge-warning' : 'badge-success'}">${r.role}</span></td>
                        <td>${r.department || '-'}</td>
                        <td>${r.phone || '-'}</td>
                    </tr>
                `).join('');
            }
        }

        window.addEventListener('DOMContentLoaded', generateReport);
    </script>
</body>
</html>
