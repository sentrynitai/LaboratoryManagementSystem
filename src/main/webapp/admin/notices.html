</head>

            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>

                <a href="laboratories.html" class="nav-item">

                <a href="users.html" class="nav-item">

                    Users
                </a>
                <a href="lab-details.html" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>

            <div class="sidebar-footer">

                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Sign Out
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h1 class="text-xl font-bold text-slate-800">Publish & Manage Notices</h1>
                <div class="flex items-center gap-3">
                    <span class="text-sm font-medium text-slate-600">Role: <strong class="text-blue-600">Administrator</strong></span>
                    <a href="../logout" class="px-3 py-1.5 text-xs font-semibold bg-red-50 text-red-600 border border-red-200 rounded-lg hover:bg-red-100">Logout</a>
                </div>
            </header>

            <div class="content-body">
                <!-- Notifications -->
                <div id="alertMsg" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- Notice Form -->
                    <div class="card lg:col-span-1">
                        <h3 class="text-lg font-bold text-slate-800 mb-2">Create New Notice</h3>
                        <p class="text-xs text-slate-500 mb-6">Broadcast institution-wide circulars, lab policies, and semester updates</p>

                        <form id="noticeForm" onsubmit="postNotice(event)">
                            <input type="hidden" name="action" value="add">

                            <div class="form-group mb-4">
                                <label class="form-label" for="noticeTitle">Notice Title *</label>
                                <input type="text" id="noticeTitle" name="title" required placeholder="e.g. Laboratory Maintenance & Safety Guidelines" class="form-control">
                            </div>

                            <div class="form-group mb-6">
                                <label class="form-label" for="noticeDesc">Notice Description *</label>
                                <textarea id="noticeDesc" name="description" required placeholder="Detailed message for students and faculty..." class="form-control" rows="5"></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-full py-2.5">
                                📢 Broadcast Notice
                            </button>
                        </form>
                    </div>

                    <!-- Notices List -->
                    <div class="card lg:col-span-2">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-bold text-slate-800">All Published Notices</h3>
                            <button onclick="loadNotices()" class="text-xs font-semibold text-blue-600 hover:text-blue-700">Refresh &circlearrowright;</button>
                        </div>

                        <div id="noticesList" class="space-y-4">
                            <p class="text-center py-6 text-slate-400">Loading notices...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript interacting with NoticeServlet -->
    <script>
        async function loadNotices() {
            try {
                const res = await fetch('../notices');
                const notices = await res.json();
                const container = document.getElementById('noticesList');

                if (!notices || notices.length === 0) {
                    container.innerHTML = '<p class="text-center py-6 text-slate-400">No notices published yet.</p>';
                    return;
                }

                container.innerHTML = notices.map(n => `
                    <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl hover:border-slate-300 transition-colors">
                        <div class="flex items-center justify-between gap-4 mb-2">
                            <h4 class="font-bold text-slate-900 text-base">${escapeHtml(n.title)}</h4>
                            <div class="flex items-center gap-3">
                                <span class="px-2 py-0.5 text-xs font-semibold rounded bg-blue-100 text-blue-800">${escapeHtml(n.facultyName || 'Administration')}</span>
                                <button onclick="deleteNotice(${n.id})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Delete</button>
                            </div>
                        </div>
                        <p class="text-sm text-slate-700 whitespace-pre-line">${escapeHtml(n.description)}</p>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('noticesList').innerHTML = '<p class="text-center py-6 text-red-500">Failed to load notices.</p>';
            }
        }

        async function postNotice(e) {
            e.preventDefault();
            const formData = new FormData(document.getElementById('noticeForm'));
            const params = new URLSearchParams(formData);

            try {
                const res = await fetch('../notices', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });
                const result = await res.json();
                if (result.success) {
                    showAlert(result.message, false);
                    document.getElementById('noticeForm').reset();
                    loadNotices();
                } else {
                    showAlert(result.message, true);
                }
            } catch (err) {
                showAlert('Failed to publish notice', true);
            }
        }

        async function deleteNotice(id) {
            if (!confirm('Are you sure you want to delete this notice?')) return;
            try {
                const res = await fetch('../notices', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `action=delete&id=${id}`
                });
                const result = await res.json();
                if (result.success) {
                    showAlert(result.message, false);
                    loadNotices();
                } else {
                    showAlert(result.message, true);
                }
            } catch (err) {
                showAlert('Failed to delete notice', true);
            }
        }

        function showAlert(msg, isError) {
            const alert = document.getElementById('alertMsg');
            alert.className = `mb-6 p-4 rounded-xl text-sm font-medium ${isError ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'} block`;
            alert.textContent = msg;
            setTimeout(() => { alert.className = 'hidden'; }, 4000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.toString().replace(/[&<>"']/g, m => map[m]);
        }

        window.addEventListener('DOMContentLoaded', loadNotices);
    </script>
</body>
